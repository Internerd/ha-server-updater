name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
        env:
          # On push events, hacs/action's preflight() takes the ref straight
          # from the push event payload ("refs/heads/main"), which is not a
          # valid raw.githubusercontent.com path segment and breaks the
          # hacs.json/manifest.json fetch. REPOSITORY_REF (read via plain
          # os.getenv, not an action input) overrides that with a real
          # branch name. See hacs/integration action/action.py::preflight().
          REPOSITORY_REF: ${{ github.head_ref || github.ref_name }}
