name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # hacs/action derives the download ref itself when "repository" is
          # omitted, using the raw GITHUB_REF (e.g. "refs/heads/main"), which
          # is not a valid raw.githubusercontent.com path segment and makes
          # it fail to fetch hacs.json/manifest.json. Pass a plain
          # "owner/repo@branch" ref explicitly to avoid that.
          repository: ${{ github.repository }}@${{ github.head_ref || github.ref_name }}
